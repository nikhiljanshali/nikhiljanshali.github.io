<section class="section about" id='about'>
  <div class="container">
    <div class="section-box">
      <div class="about-title" data-aos="fade-up">
        <h3 class="section-title">
          <span class='n-section-title'>01.</span> {{"AboutMe.Title" | translate}}
        </h3>
      </div>
      <div class="about-section" data-aos="fade-up" data-aos-duration="1000">
        <div class="image-slider float-md-end mb-3 ms-md-3">
          <img [src]="images[currentIndex]" class="rounded shadow-lg img-fluid" alt="About image">
        </div>

        <div class="text-content">
          <p *ngFor="let text of 'AboutMe.Paragraphs' | translate" [innerHTML]="text"></p>
        </div>
      </div>

      <div class="row align-items-center">
        <div class="col-12 col-md-12 mb-4 mb-md-0">
          <div class="about-description pe-md-4">
            <ul class="skills-list" data-aos="fade-up">
              <li *ngFor="let skills of 'AboutMe.Technologies' | translate" class="skill-element" data-aos="fade-up"
                data-aos-duration="1000">
                <span class="underline">{{ skills }}</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
