<section class="section banner">
  <div [@bannerTrigger] class="container">
    <div class="row">
      <div class="col-12 col-md-8">
        <div class="section-box-banner">
          <div class="content">
            <div>
              <h1 class="home-title">{{"Banner.Title" | translate}}</h1>
              <h1>{{"Banner.Pretitle" | translate}}</h1>
            </div>
            <div class='banner-title'>
              <h2>{{"Banner.TitleName" | translate}}</h2>
              <h2 class="home-author">
                `<span id="dynamic-text">{{ dynamicText }}</span>`
              </h2>
            </div>
            <div class='banner-description'>
              <p [innerHTML]='"Banner.Description" | translate' class="mt-4"></p>
            </div>
          </div>
          <div class="div-btn-banner mt-5">
            <a (click)='analyticsService.sendAnalyticEvent("click_send_mail", "banner", "email")'
              href="mailto:nikhil.janshali@hotmail.com" target="_black" class="main-btn">
              {{"Banner.ActionBtn" | translate}}
            </a>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="about-section" data-aos="fade-up" data-aos-duration="1000">
          <div class="image-slider float-md-end">
            <img [src]="images[currentIndex]" class="rounded shadow-lg img-fluid" alt="About image">
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
